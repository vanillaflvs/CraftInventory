<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário Clássico do Minecraft</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-bg: #C6C6C6;
            --mc-border-light: #FFFFFF;
            --mc-border-dark: #555555;
            --mc-slot-bg: #8B8B8B;
            --mc-slot-shadow: #373737;
            --mc-slot-highlight: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background-color: #1A1A1A;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            position: relative;
        }

        /* =========================================================
           1. CENÁRIO DE FUNDO COM A IMAGEM (FotoFundo.jpeg) EMBAÇADA
           ========================================================= */
        .mc-scenery {
            position: fixed;
            inset: -24px;
            z-index: 0;
            filter: blur(8px);
            transform: scale(1.05);
            pointer-events: none;
            background-color: #1A1A1A;
            background-image:
                url('images/Fundo/FotoFundo.jpeg'),
                url('https://raw.githubusercontent.com/vanillaflvs/CraftInventory/main/public/images/Fundo/FotoFundo.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Vinheta escura sutil sobre o fundo (como ao abrir o inventário no jogo) */
        .mc-vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.65) 100%);
        }

        /* =========================================================
           2. JANELA PRINCIPAL DO INVENTÁRIO AMPLIADA (588px)
           ========================================================= */
        .mc-window {
            background-color: var(--mc-bg);
            border: 4px solid #000000;
            box-shadow:
                inset 4px 4px 0px var(--mc-border-light),
                inset -4px -4px 0px var(--mc-border-dark),
                0 20px 48px rgba(0, 0, 0, 0.78);
            padding: 20px;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 588px;
        }

        /* Seção Superior: Armaduras (esquerda), Caixa Preta Vazia (centro) e Escudo (direita) */
        .mc-top-section {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 20px;
        }

        /* Coluna dos 4 Slots Verticais de Armadura */
        .mc-armor-col {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Caixa preta rebaixada onde fica o espaço vazio do personagem (162x241px) */
        .mc-player-box {
            width: 162px;
            height: 241px;
            background-color: #000000;
            border-top: 4px solid var(--mc-slot-shadow);
            border-left: 4px solid var(--mc-slot-shadow);
            border-right: 4px solid var(--mc-slot-highlight);
            border-bottom: 4px solid var(--mc-slot-highlight);
        }

        /* Grades do Inventário (3x9 e 1x9) */
        .mc-main-section {
            margin-bottom: 15px;
        }

        .mc-hotbar-section {
            padding-top: 5px;
        }

        /* Aba da Lixeira acoplada rente ao lado externo direito, alinhada à barra rápida */
        .mc-trash-tab {
            position: absolute;
            left: 100%;
            bottom: -4px;
            background-color: var(--mc-bg);
            border: 4px solid #000000;
            box-shadow:
                inset 4px 4px 0px var(--mc-border-light),
                inset -4px -4px 0px var(--mc-border-dark),
                8px 12px 24px rgba(0, 0, 0, 0.55);
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9;
        }

        .mc-trash-slot {
            width: 58px;
            height: 58px;
            background-color: var(--mc-slot-bg);
            border-top: 4px solid var(--mc-slot-shadow);
            border-left: 4px solid var(--mc-slot-shadow);
            border-right: 4px solid var(--mc-slot-highlight);
            border-bottom: 4px solid var(--mc-slot-highlight);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
        }

        .mc-trash-slot:hover,
        .mc-trash-slot.drag-over {
            background-color: #A85454;
            outline: 3px solid #FF5555;
            z-index: 6;
        }

        .mc-trash-slot svg {
            width: 34px;
            height: 34px;
            pointer-events: none;
        }

        .mc-grid-9 {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 3px;
        }

        /* Slots individuais do Inventário (58x58px) */
        .mc-slot {
            width: 58px;
            height: 58px;
            background-color: var(--mc-slot-bg);
            border-top: 4px solid var(--mc-slot-shadow);
            border-left: 4px solid var(--mc-slot-shadow);
            border-right: 4px solid var(--mc-slot-highlight);
            border-bottom: 4px solid var(--mc-slot-highlight);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .mc-slot:hover::after,
        .mc-slot.selected::after {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.35);
            pointer-events: none;
            z-index: 5;
        }

        .mc-slot.selected {
            outline: 3px solid #FFFFFF;
            z-index: 6;
        }

        .mc-slot.moving-source {
            outline: 3px dashed #FFFF55;
            z-index: 7;
        }

        .mc-slot.drag-over {
            outline: 3px solid #55FF55;
            z-index: 7;
        }

        /* Contador numérico clássico de pilha (1 a 64) no canto inferior direito do slot */
        .slot-count {
            position: absolute;
            right: 4px;
            bottom: 3px;
            color: #FFFFFF;
            font-size: 11px;
            line-height: 1;
            text-shadow: 2px 2px 0px #3F3F3F;
            pointer-events: none;
            z-index: 4;
        }

        /* Silhuetas dos slots vazios de armadura e escudo */
        .slot-silhouette {
            width: 38px;
            height: 38px;
            opacity: 0.45;
            pointer-events: none;
        }

        /* =========================================================
           3. BARRA LATERAL ESTILO JEI (CANTO DIREITO - ALTURA INTEIRA 100vh)
           ========================================================= */
        .jei-sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            height: 100vh;
            width: 252px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: transparent;
            padding: 8px 8px 8px 6px;
        }

        /* Cabeçalho JEI: Botão Anterior, Contador 1/16 e Botão Próximo */
        .jei-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 36px;
            flex-shrink: 0;
        }

        .jei-page-indicator {
            color: #FFFFFF;
            font-size: 13px;
            text-shadow: 2px 2px 0px #3F3F3F;
            letter-spacing: 0.5px;
        }

        /* Grade Central Dinâmica JEI: 6 colunas ocupando toda a altura disponível */
        .jei-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(6, 38px);
            grid-auto-rows: 38px;
            gap: 2px;
            justify-content: space-between;
            align-content: start;
            overflow: hidden;
            margin: 8px 0;
        }

        .jei-cell {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: transparent;
        }

        .jei-cell:hover {
            background-color: rgba(255, 255, 255, 0.35);
        }

        .jei-cell.has-item {
            cursor: pointer;
        }

        .jei-cell img {
            width: 34px;
            height: 34px;
            max-width: 92%;
            max-height: 92%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
        }

        /* Rodapé JEI: Caixa de Pesquisa + Botão Decorativo de Chave Inglesa */
        .jei-footer {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 36px;
            flex-shrink: 0;
        }

        .jei-search {
            flex: 1;
            height: 36px;
            background-color: #000000;
            border: 2px solid #A0A0A0;
            outline: 2px solid #000000;
            outline-offset: -4px;
            color: #FFFFFF;
            font-size: 11px;
            padding: 0 8px;
            min-width: 0;
        }

        .jei-search:focus {
            border-color: #FFFFFF;
        }

        /* Botões Quadrados Estilo Minecraft (Setas e Chave Inglesa) */
        .jei-square-btn {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            background-color: #8B8B8B;
            border: 2px solid #000000;
            box-shadow:
                inset 2px 2px 0px #C6C6C6,
                inset -2px -2px 0px #555555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            color: #FFFFFF;
        }

        .jei-square-btn:hover {
            background-color: #9B9B9B;
            box-shadow:
                inset 2px 2px 0px #DCDCDC,
                inset -2px -2px 0px #656565;
        }

        .jei-square-btn:active {
            box-shadow:
                inset 2px 2px 0px #555555,
                inset -2px -2px 0px #C6C6C6;
        }

        .jei-square-btn svg {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        /* Tooltip clássico estilo Minecraft com borda roxa ao passar o mouse nos itens JEI */
        .mc-tooltip {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            background-color: rgba(16, 0, 16, 0.94);
            border: 2px solid #28007F;
            box-shadow: 0 0 0 2px #100010;
            color: #FFFFFF;
            font-size: 10px;
            line-height: 1.5;
            padding: 6px 8px;
            text-shadow: 2px 2px 0px #3F3F3F;
            display: none;
            white-space: nowrap;
        }

        /* Modal Quadrado Estilo Minecraft para Escolher Quantidade (1 a 64) */
        .mc-qty-overlay {
            position: fixed;
            inset: 0;
            z-index: 120;
            background-color: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .mc-qty-overlay.active {
            display: flex;
        }

        .mc-qty-box {
            background-color: var(--mc-bg);
            border: 4px solid #000000;
            box-shadow:
                inset 4px 4px 0px var(--mc-border-light),
                inset -4px -4px 0px var(--mc-border-dark),
                0 16px 40px rgba(0, 0, 0, 0.85);
            padding: 18px;
            width: 100%;
            max-width: 310px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            text-align: center;
        }

        .mc-qty-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #3F3F3F;
            font-size: 11px;
            line-height: 1.4;
        }

        .mc-qty-header img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .mc-qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mc-qty-input {
            width: 92px;
            height: 40px;
            background-color: #000000;
            border: 2px solid #A0A0A0;
            outline: 2px solid #000000;
            outline-offset: -4px;
            color: #FFFFFF;
            font-size: 14px;
            text-align: center;
        }

        .mc-qty-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .mc-btn {
            height: 36px;
            background-color: #8B8B8B;
            border: 2px solid #000000;
            box-shadow:
                inset 2px 2px 0px #C6C6C6,
                inset -2px -2px 0px #555555;
            color: #FFFFFF;
            font-size: 10px;
            text-shadow: 2px 2px 0px #3F3F3F;
            cursor: pointer;
            padding: 0 8px;
        }

        .mc-btn:hover {
            background-color: #9B9B9B;
            box-shadow:
                inset 2px 2px 0px #DCDCDC,
                inset -2px -2px 0px #656565;
        }

        .mc-btn:active {
            box-shadow:
                inset 2px 2px 0px #555555,
                inset -2px -2px 0px #C6C6C6;
        }

        .mc-qty-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* =========================================================
           4. RESPONSIVIDADE PARA TELAS MENORES
           ========================================================= */
        @media (max-width: 1180px) {
            body {
                padding-right: 340px;
            }
            .mc-window {
                max-width: 484px;
                padding: 16px;
            }
            .mc-slot,
            .mc-trash-slot {
                width: 48px;
                height: 48px;
                border-width: 3px;
            }
            .mc-trash-tab {
                padding: 10px;
                border-width: 3px;
                bottom: -3px;
            }
            .mc-trash-slot svg {
                width: 28px;
                height: 28px;
            }
            .slot-silhouette {
                width: 32px;
                height: 32px;
            }
            .mc-player-box {
                width: 132px;
                height: 198px;
                border-width: 3px;
            }
        }

        @media (max-width: 820px) {
            body {
                flex-direction: column;
                padding: 12px;
                overflow-y: auto;
            }
            .mc-trash-tab {
                position: static;
                margin-top: 12px;
                align-self: flex-end;
            }
            .jei-sidebar {
                position: relative;
                right: auto;
                top: auto;
                bottom: auto;
                height: 480px;
                width: 252px;
                margin-top: 16px;
            }
        }

        @media (max-width: 520px) {
            .mc-window {
                padding: 10px;
                max-width: 362px;
            }
            .mc-slot,
            .mc-trash-slot {
                width: 36px;
                height: 36px;
                border-width: 2px;
            }
            .mc-trash-tab {
                padding: 6px;
                border-width: 2px;
            }
            .mc-trash-slot svg {
                width: 22px;
                height: 22px;
            }
            .slot-silhouette {
                width: 24px;
                height: 24px;
            }
            .mc-player-box {
                width: 100px;
                height: 150px;
                border-width: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- 1. Cenário de Fundo com a Foto (kfl.jpeg) -->
    <div class="mc-scenery" aria-hidden="true"></div>

    <!-- Overlay de Vinheta Escura -->
    <div class="mc-vignette" aria-hidden="true"></div>

    <!-- 2. Janela Principal do Inventário Clássico do Minecraft (588px) -->
    <main class="mc-window" aria-label="Inventário do Minecraft">
        <!-- Seção Superior: 4 Slots de Armadura, Caixa Preta Vazia do Personagem e Slot de Escudo -->
        <section class="mc-top-section">
            <!-- Coluna Vertical de Armaduras -->
            <div class="mc-armor-col">
                <!-- Capacete -->
                <div class="mc-slot" title="Capacete">
                    <svg class="slot-silhouette" viewBox="0 0 16 16" fill="#4A4A4A" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 4h10v2h1v6h-2v-3H4v3H2V6h1V4zm2 2v1h6V6H5z"/>
                    </svg>
                </div>
                <!-- Peitoral -->
                <div class="mc-slot" title="Peitoral">
                    <svg class="slot-silhouette" viewBox="0 0 16 16" fill="#4A4A4A" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 3h4v2h4V3h4v4h-2v6H4V7H2V3z"/>
                    </svg>
                </div>
                <!-- Calças -->
                <div class="mc-slot" title="Calças">
                    <svg class="slot-silhouette" viewBox="0 0 16 16" fill="#4A4A4A" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 2h8v12H9V7H7v7H4V2z"/>
                    </svg>
                </div>
                <!-- Botas -->
                <div class="mc-slot" title="Botas">
                    <svg class="slot-silhouette" viewBox="0 0 16 16" fill="#4A4A4A" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 5h3v5h1v3H2v-3h1V5zm7 0h3v5h1v3H9v-3h1V5z"/>
                    </svg>
                </div>
            </div>

            <!-- Espaço Vazio Rebaixado do Personagem (162x241px) -->
            <div class="mc-player-box" aria-label="Espaço do Personagem"></div>

            <!-- Slot de Escudo / Mão Secundária -->
            <div class="mc-slot" title="Mão Secundária / Escudo">
                <svg class="slot-silhouette" viewBox="0 0 16 16" fill="#4A4A4A" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 2h10v7c0 3-5 5-5 5s-5-2-5-5V2zm2 2v4c0 1.5 3 3 3 3s3-1.5 3-3V4H5z"/>
                </svg>
            </div>
        </section>

        <!-- Seção Principal do Inventário: Grade 3x9 (27 slots) -->
        <section class="mc-main-section" aria-label="Inventário Principal">
            <div class="mc-grid-9">
                <!-- Linha 1 (9 slots) -->
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <!-- Linha 2 (9 slots) -->
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <!-- Linha 3 (9 slots) -->
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
            </div>
        </section>

        <!-- Barra Rápida (Hotbar): Grade 1x9 (9 slots) -->
        <section class="mc-hotbar-section" aria-label="Barra Rápida">
            <div class="mc-grid-9">
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
                <div class="mc-slot"></div>
            </div>
        </section>

        <!-- Lixeira no canto inferior direito, alinhada perfeitamente fora da borda do inventário -->
        <div class="mc-trash-tab">
            <div class="mc-trash-slot" id="mcTrashSlot" title="Lixeira (Clique com item selecionado ou arraste para excluir)" aria-label="Lixeira">
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 2h6v1h3v2H2V3h3V2zm-1 4h8l-1 8H5L4 6zm2 1v6h1V7H6zm3 0v6h1V7H9z" fill="#3F3F3F"/>
                    <path d="M5 1h6v1h3v2H2V2h3V1zm-1 4h8l-1 8H5L4 5zm2 1v6h1V6H6zm3 0v6h1V6H9z" fill="#D8D8D8"/>
                </svg>
            </div>
        </div>
    </main>

    <!-- 3. Barra Lateral Estilo JEI (Just Enough Items) - Altura Inteira (100vh) -->
    <aside class="jei-sidebar" aria-label="Lista de Itens JEI">
        <!-- Cabeçalho com Setas de Navegação e Contador 1/1 -->
        <div class="jei-header">
            <button type="button" class="jei-square-btn" id="jeiPrevPageBtn" title="Página Anterior" aria-label="Página Anterior">
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="11,3 5,8 11,13" fill="#3F3F3F" transform="translate(1,1)"/>
                    <polygon points="11,3 5,8 11,13" fill="#FFFFFF"/>
                </svg>
            </button>
            <span class="jei-page-indicator" id="jeiPageIndicator">1/1</span>
            <button type="button" class="jei-square-btn" id="jeiNextPageBtn" title="Próxima Página" aria-label="Próxima Página">
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="5,3 11,8 5,13" fill="#3F3F3F" transform="translate(1,1)"/>
                    <polygon points="5,3 11,8 5,13" fill="#FFFFFF"/>
                </svg>
            </button>
        </div>

        <!-- Grade Central Dinâmica 6 colunas x N linhas -->
        <div class="jei-grid" id="jeiGrid"></div>

        <!-- Rodapé com Busca e Botão Decorativo de Chave Inglesa (Wrench) -->
        <div class="jei-footer">
            <input
                type="text"
                class="jei-search"
                id="jeiSearchInput"
                placeholder=""
                aria-label="Pesquisar itens"
                autocomplete="off"
            />
            <button type="button" class="jei-square-btn" aria-label="Configurações JEI">
                <!-- Ícone Pixel-Art de Chave Inglesa (Wrench) -->
                <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 1h3v1h1v3h-1v1h-2v1H9v1H8v1H7v1H6v1H5v2H3v1H2v-1H1v-2h1v-1h2V9h1V8h1V7h1V6h1V4h1V2h1V1z" fill="#1E1E1E"/>
                    <path d="M10 2h2v1h-1v2h2v1h-2v1H9v1H8v1H7v1H6v1H5v1H3v1H2v-1h1v-2h1V9h1V8h1V7h1V6h1V4h1V2z" fill="#A8A8A8"/>
                    <path d="M10 2h1v1h-1V2zM8 5h1v1H8V5zM7 6h1v1H7V6zM6 7h1v1H6V7zM5 8h1v1H5V8zM4 9h1v1H4V9zM3 10h1v1H3v-1z" fill="#D8D8D8"/>
                </svg>
            </button>

    </aside>

    <!-- Tooltip Flutuante Clássico Estilo Minecraft com Borda Roxa -->
    <div class="mc-tooltip" id="mcTooltip"></div>

    <!-- Quadrado Estilo Minecraft para Escolha de Quantidade (Máx. 64) -->
    <div class="mc-qty-overlay" id="mcQtyOverlay" role="dialog" aria-modal="true" aria-labelledby="mcQtyTitle">
        <div class="mc-qty-box">
            <div class="mc-qty-header">
                <img id="mcQtyPreviewImg" src="" alt="" />
                <span id="mcQtyTitle">Quantidade (1-64)</span>
            </div>
            <div class="mc-qty-controls">
                <button type="button" class="jei-square-btn" id="mcQtyMinusBtn" aria-label="Diminuir quantidade">-1</button>
                <input type="number" class="mc-qty-input" id="mcQtyInput" min="1" max="64" value="1" />
                <button type="button" class="jei-square-btn" id="mcQtyPlusBtn" aria-label="Aumentar quantidade">+1</button>
            </div>
            <div class="mc-qty-presets">
                <button type="button" class="mc-btn" data-preset="1">1</button>
                <button type="button" class="mc-btn" data-preset="16">16</button>
                <button type="button" class="mc-btn" data-preset="32">32</button>
                <button type="button" class="mc-btn" data-preset="64">64</button>
            </div>
            <div class="mc-qty-actions">
                <button type="button" class="mc-btn" id="mcQtyCancelBtn">Cancelar</button>
                <button type="button" class="mc-btn" id="mcQtyConfirmBtn">Confirmar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        /**
         * =====================================================================
         * LISTA PADRÃO DE ITENS DO PAINEL LATERAL JEI (JUST ENOUGH ITEMS)
         * Caminhos exatos da estrutura public/images/ do projeto CraftInventory
         * =====================================================================
         */
        const CATALOG_VERSION = 'v2-subfolders';
        const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/vanillaflvs/CraftInventory/main/public/';

        const defaultJeiItems = [
            // Ferramentas
            { name: 'Arco', category: 'Ferramentas', img: 'images/Ferramentas/Arco.png' },
            { name: 'Balde de Água', category: 'Ferramentas', img: 'images/Ferramentas/BaldeAgua.png' },
            { name: 'Enxada de Diamante', category: 'Ferramentas', img: 'images/Ferramentas/EnxadaDiamante.png' },
            { name: 'Espada de Ouro', category: 'Ferramentas', img: 'images/Ferramentas/EspadaOuro.png' },
            { name: 'Flecha', category: 'Ferramentas', img: 'images/Ferramentas/Flecha.png' },
            { name: 'Machado de Ferro', category: 'Ferramentas', img: 'images/Ferramentas/MachadoFerro.png' },
            { name: 'Pá de Pedra', category: 'Ferramentas', img: 'images/Ferramentas/PaPedra.png' },
            { name: 'Pérola do Fim', category: 'Ferramentas', img: 'images/Ferramentas/PerolaDoFim.png' },
            { name: 'Picareta de Netherita', category: 'Ferramentas', img: 'images/Ferramentas/PicaretaNetherita.png' },
            // Blocos
            { name: 'Areia', category: 'Bloco', img: 'images/Bloco/Areia.png' },
            { name: 'Baú', category: 'Bloco', img: 'images/Bloco/Bau.png' },
            { name: 'Bloco de Grama', category: 'Bloco', img: 'images/Bloco/BlocoGrama.png' },
            { name: 'Fornalha', category: 'Bloco', img: 'images/Bloco/Fornalha.png' },
            { name: 'Madeira de Carvalho', category: 'Bloco', img: 'images/Bloco/MadeiraCarvalho.png' },
            { name: 'Mesa de Trabalho', category: 'Bloco', img: 'images/Bloco/MesaDeTrabalho.png' },
            { name: 'Pedregulho', category: 'Bloco', img: 'images/Bloco/Pedregulho.png' },
            { name: 'Rocha Matriz', category: 'Bloco', img: 'images/Bloco/RochaMatriz.png' },
            { name: 'Vidro', category: 'Bloco', img: 'images/Bloco/Vidro.png' },
            // Comidas
            { name: 'Bagas Doces', category: 'Comida', img: 'images/Comida/BagasDocess.png' },
            { name: 'Batata', category: 'Comida', img: 'images/Comida/Batata.png' },
            { name: 'Batata Assada', category: 'Comida', img: 'images/Comida/BatataAssada.png' },
            { name: 'Biscoito', category: 'Comida', img: 'images/Comida/Biscoito.png' },
            { name: 'Carne de Boi', category: 'Comida', img: 'images/Comida/CarneBoi.png' },
            { name: 'Carne de Porco', category: 'Comida', img: 'images/Comida/CarnePorco.png' },
            { name: 'Cenoura', category: 'Comida', img: 'images/Comida/Cenoura.png' },
            { name: 'Frango Assado', category: 'Comida', img: 'images/Comida/FrangoAssado.png' },
            { name: 'Maçã', category: 'Comida', img: 'images/Comida/Maca.png' },
            { name: 'Maçã Dourada', category: 'Comida', img: 'images/Comida/MacaDourada.png' },
            { name: 'Pão', category: 'Comida', img: 'images/Comida/Pao.png' },
            // Armaduras
            { name: 'Botas de Cota de Malha', category: 'Armadura', img: 'images/Armadura/CotaDeMalhaBota.png' },
            { name: 'Calças de Cota de Malha', category: 'Armadura', img: 'images/Armadura/CotaDeMalhaCalca.png' },
            { name: 'Capacete de Cota de Malha', category: 'Armadura', img: 'images/Armadura/CotaDeMalhaCapacete.png' },
            { name: 'Peitoral de Cota de Malha', category: 'Armadura', img: 'images/Armadura/CotaDeMalhaPeitoral.png' }
        ];

        let jeiItems = [...defaultJeiItems];

        // Constantes de layout do JEI
        const TOTAL_PAGES = 1;
        const JEI_COLS = 6;
        const CELL_STEP = 40; // 38px célula + 2px gap

        // Referências DOM
        const jeiGrid = document.getElementById('jeiGrid');
        const jeiPageIndicator = document.getElementById('jeiPageIndicator');
        const jeiPrevPageBtn = document.getElementById('jeiPrevPageBtn');
        const jeiNextPageBtn = document.getElementById('jeiNextPageBtn');
        const jeiSearchInput = document.getElementById('jeiSearchInput');
        const mcTooltip = document.getElementById('mcTooltip');

        // Referências do Quadrado de Quantidade
        const mcQtyOverlay = document.getElementById('mcQtyOverlay');
        const mcQtyPreviewImg = document.getElementById('mcQtyPreviewImg');
        const mcQtyTitle = document.getElementById('mcQtyTitle');
        const mcQtyInput = document.getElementById('mcQtyInput');
        const mcQtyMinusBtn = document.getElementById('mcQtyMinusBtn');
        const mcQtyPlusBtn = document.getElementById('mcQtyPlusBtn');
        const mcQtyCancelBtn = document.getElementById('mcQtyCancelBtn');
        const mcQtyConfirmBtn = document.getElementById('mcQtyConfirmBtn');
        const mcQtyPresetBtns = document.querySelectorAll('[data-preset]');

        let currentPage = 1;
        let searchQuery = '';
        let pendingItemForQty = null;
        let pendingEditSlotIdx = null;
        let movingFromSlotIdx = null;
        let draggedSlotIdx = null;

        // =====================================================================
        // CONEXÃO COM O BANCO DE DADOS NA NUVEM (CATÁLOGO JEI + SLOTS DO INVENTÁRIO)
        // =====================================================================
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'craft-inventory-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let db = null;
        let auth = null;
        let currentUser = null;
        let inventorySlotsState = Array(41).fill(null);

        function resolveImageUrl(imgPath) {
            if (!imgPath) return '';
            // Em ambiente local/Express usa o caminho relativo public/ (images/...);
            // se estiver em preview externo ou falhar, o fallback carrega do GitHub raw.
            return imgPath;
        }

        function attachImageWithFallback(imgElement, item) {
            imgElement.src = resolveImageUrl(item.img);
            imgElement.alt = item.name || 'Item';
            imgElement.onerror = function () {
                if (!this.dataset.retriedGithub && item.img && !/^https?:\/\//i.test(item.img)) {
                    this.dataset.retriedGithub = 'true';
                    this.src = `${GITHUB_RAW_BASE}${item.img}`;
                    return;
                }
                this.onerror = null;
                this.src = `https://placehold.co/34x34/555555/FFFFFF?text=${encodeURIComponent((item.name || '?').slice(0, 3))}`;
            };
        }

        async function saveInventoryToCloud() {
            if (!db || !currentUser) return;
            try {
                const invDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'inventory_state', 'main');
                await setDoc(invDocRef, {
                    slots: JSON.stringify(inventorySlotsState),
                    updatedAt: Date.now()
                }, { merge: true });
            } catch (err) {
                console.error('Erro ao salvar inventário no banco de dados:', err);
            }
        }

        async function initCloudDatabase() {
            if (!firebaseConfig) return;
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Autenticação obrigatória antes de qualquer leitura/escrita no banco
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const cred = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    currentUser = cred.user;
                }

                if (!currentUser) return;

                // 1. Sincroniza o catálogo de itens do JEI salvo no banco de dados público
                const catalogDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'jei_catalog', 'items');
                onSnapshot(catalogDocRef, (snap) => {
                    const data = snap.exists() ? snap.data() : null;
                    if (data && data.version === CATALOG_VERSION && Array.isArray(data.items) && data.items.length > 0) {
                        jeiItems = data.items;
                        renderJeiGrid();
                    } else {
                        // Atualiza o banco de dados com os caminhos exatos das subpastas de public/images/
                        setDoc(catalogDocRef, {
                            version: CATALOG_VERSION,
                            items: defaultJeiItems,
                            updatedAt: Date.now()
                        }).catch(() => {});
                    }
                }, (err) => {
                    console.error('Erro ao sincronizar catálogo JEI:', err);
                });

                // 2. Sincroniza os slots do inventário do usuário no banco de dados privado
                const invDocRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'inventory_state', 'main');
                onSnapshot(invDocRef, (snap) => {
                    if (snap.exists() && snap.data().slots) {
                        try {
                            const parsed = JSON.parse(snap.data().slots);
                            if (Array.isArray(parsed)) {
                                inventorySlotsState = parsed;
                                renderInventorySlots();
                            }
                        } catch (e) {
                            console.error('Erro ao ler slots salvos:', e);
                        }
                    }
                }, (err) => {
                    console.error('Erro ao sincronizar inventário:', err);
                });
            } catch (error) {
                console.error('Falha ao conectar ao banco de dados:', error);
            }
        }

        /**
         * Calcula dinamicamente quantos slots (6 colunas x N linhas)
         * cabem na altura atual da janela (100vh).
         */
        function getSlotsPerPage() {
            const availableHeight = jeiGrid.clientHeight || (window.innerHeight - 104);
            const rows = Math.max(4, Math.floor((availableHeight + 2) / CELL_STEP));
            return JEI_COLS * rows;
        }

        /**
         * Retorna a lista filtrada conforme o texto digitado na busca.
         */
        function getFilteredItems() {
            const query = searchQuery.trim().toLowerCase();
            if (!query) return jeiItems;
            return jeiItems.filter(item =>
                item && (item.name || '').toLowerCase().includes(query)
            );
        }

        /**
         * Renderiza a grade do JEI para a página atual.
         */
        function renderJeiGrid() {
            jeiGrid.innerHTML = '';
            const slotsPerPage = getSlotsPerPage();
            const filtered = getFilteredItems();

            // Mantém página única (1/1)
            const totalPages = TOTAL_PAGES;

            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            jeiPageIndicator.textContent = `${currentPage}/${totalPages}`;

            const startIndex = (currentPage - 1) * slotsPerPage;
            for (let i = 0; i < slotsPerPage; i++) {
                const item = filtered[startIndex + i];
                const cell = createJeiCell(item);
                jeiGrid.appendChild(cell);
            }
        }

        /**
         * Cria uma célula individual da grade JEI (com ou sem imagem).
         */
        function createJeiCell(item) {
            const cell = document.createElement('div');
            cell.className = 'jei-cell';

            if (item && item.img) {
                cell.classList.add('has-item');

                const img = document.createElement('img');
                attachImageWithFallback(img, item);
                cell.appendChild(img);
                // Clique em um item do JEI abre o quadrado para escolher a quantidade (1 a 64)
                cell.addEventListener('click', () => {
                    mcTooltip.style.display = 'none';
                    openQuantityModal(item, null);
                });

                // Exibe tooltip clássico apenas ao passar o mouse sobre itens preenchidos
                cell.addEventListener('mouseenter', (e) => {
                    if (!item.name) return;
                    mcTooltip.textContent = item.name;
                    mcTooltip.style.display = 'block';
                    moveTooltip(e);
                });

                cell.addEventListener('mousemove', moveTooltip);

                cell.addEventListener('mouseleave', () => {
                    mcTooltip.style.display = 'none';
                });
            }

            return cell;
        }

        /**
         * Posiciona o tooltip acompanhando o cursor do mouse sem sair da tela.
         */
        function moveTooltip(e) {
            const offset = 14;
            let left = e.clientX + offset;
            let top = e.clientY + offset;

            const rect = mcTooltip.getBoundingClientRect();
            if (left + rect.width > window.innerWidth - 8) {
                left = e.clientX - rect.width - offset;
            }
            if (top + rect.height > window.innerHeight - 8) {
                top = e.clientY - rect.height - offset;
            }

            mcTooltip.style.left = `${left}px`;
            mcTooltip.style.top = `${top}px`;
        }

        function getCurrentTotalPages() {
            return TOTAL_PAGES;
        }

        // Navegação pelos botões ◀ e ▶ com rotação circular
        jeiPrevPageBtn.addEventListener('click', () => {
            const totalPages = getCurrentTotalPages();
            currentPage = currentPage > 1 ? currentPage - 1 : totalPages;
            renderJeiGrid();
        });

        jeiNextPageBtn.addEventListener('click', () => {
            const totalPages = getCurrentTotalPages();
            currentPage = currentPage < totalPages ? currentPage + 1 : 1;
            renderJeiGrid();
        });

        // Navegação pela roda do mouse (scroll) sobre a grade JEI
        jeiGrid.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY > 0) {
                jeiNextPageBtn.click();
            } else if (e.deltaY < 0) {
                jeiPrevPageBtn.click();
            }
        }, { passive: false });

        // Pesquisa em tempo real pelo nome do item
        jeiSearchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 1;
            mcTooltip.style.display = 'none';
            renderJeiGrid();
        });

        // Recalcula automaticamente quantas linhas cabem ao redimensionar a janela
        window.addEventListener('resize', renderJeiGrid);

        // Renderização inicial do painel JEI
        renderJeiGrid();

        // Seleção e persistência interativa dos slots do inventário
        const inventorySlots = document.querySelectorAll('.mc-window .mc-slot');
        const hotbarSlots = document.querySelectorAll('.mc-hotbar-section .mc-slot');
        const mcTrashSlot = document.getElementById('mcTrashSlot');

        function clearMovingState() {
            movingFromSlotIdx = null;
            inventorySlots.forEach(s => s.classList.remove('moving-source'));
        }

        function moveOrSwapInventorySlots(fromIdx, toIdx) {
            if (fromIdx === null || toIdx === null || fromIdx === toIdx) return;
            const sourceItem = inventorySlotsState[fromIdx];
            if (!sourceItem) return;

            const targetItem = inventorySlotsState[toIdx];

            // Se forem o mesmo item, empilha até 64
            if (targetItem && targetItem.name === sourceItem.name && targetItem.img === sourceItem.img) {
                const total = (Number(targetItem.count) || 1) + (Number(sourceItem.count) || 1);
                if (total <= 64) {
                    inventorySlotsState[toIdx] = { ...targetItem, count: total };
                    inventorySlotsState[fromIdx] = null;
                } else {
                    inventorySlotsState[toIdx] = { ...targetItem, count: 64 };
                    inventorySlotsState[fromIdx] = { ...sourceItem, count: total - 64 };
                }
            } else {
                // Troca de posição ou move para slot vazio
                inventorySlotsState[toIdx] = sourceItem;
                inventorySlotsState[fromIdx] = targetItem || null;
            }

            renderInventorySlots();
            saveInventoryToCloud();
        }

        function deleteItemAtSlot(slotIdx) {
            if (slotIdx === null || slotIdx === undefined || !inventorySlotsState[slotIdx]) return;
            inventorySlotsState[slotIdx] = null;
            clearMovingState();
            renderInventorySlots();
            saveInventoryToCloud();
        }

        function renderInventorySlots() {
            inventorySlots.forEach((slot, idx) => {
                const existingImg = slot.querySelector('img.slot-item-img');
                if (existingImg) existingImg.remove();

                const existingCount = slot.querySelector('.slot-count');
                if (existingCount) existingCount.remove();

                const silhouette = slot.querySelector('.slot-silhouette');
                const savedItem = inventorySlotsState[idx];

                if (savedItem && savedItem.img) {
                    slot.setAttribute('draggable', 'true');
                    if (silhouette) silhouette.style.display = 'none';
                    const img = document.createElement('img');
                    img.className = 'slot-item-img';
                    img.style.width = '40px';
                    img.style.height = '40px';
                    img.style.objectFit = 'contain';
                    img.style.pointerEvents = 'none';
                    attachImageWithFallback(img, savedItem);
                    slot.appendChild(img);

                    const qty = Math.min(64, Math.max(1, Number(savedItem.count) || 1));
                    if (qty > 1) {
                        const countBadge = document.createElement('span');
                        countBadge.className = 'slot-count';
                        countBadge.textContent = String(qty);
                        slot.appendChild(countBadge);
                    }
                } else {
                    slot.removeAttribute('draggable');
                    if (silhouette) silhouette.style.display = '';
                }
            });
        }

        /**
         * Retorna a ordem dos slots de baixo para cima:
         * 1º: Barra Rápida (índices 32..40)
         * 2º: Linha inferior do inventário (índices 23..31)
         * 3º: Linha do meio do inventário (índices 14..22)
         * 4º: Linha superior do inventário (índices 5..13)
         */
        function getBottomUpSlotOrder() {
            const order = [];
            for (let i = 32; i <= 40; i++) order.push(i);
            for (let i = 23; i <= 31; i++) order.push(i);
            for (let i = 14; i <= 22; i++) order.push(i);
            for (let i = 5; i <= 13; i++) order.push(i);
            return order;
        }

        function clampQuantity(val) {
            const n = parseInt(val, 10);
            if (isNaN(n) || n < 1) return 1;
            if (n > 64) return 64;
            return n;
        }

        function openQuantityModal(item, editSlotIdx = null) {
            pendingItemForQty = item;
            pendingEditSlotIdx = editSlotIdx;
            mcQtyTitle.textContent = `${item.name} (Máx. 64)`;
            attachImageWithFallback(mcQtyPreviewImg, item);
            mcQtyInput.value = clampQuantity(item.count || 1);
            mcQtyOverlay.classList.add('active');
            mcQtyInput.focus();
            mcQtyInput.select();
        }

        function closeQuantityModal() {
            mcQtyOverlay.classList.remove('active');
            pendingItemForQty = null;
            pendingEditSlotIdx = null;
        }

        function equipItemToInventory(item, quantity = 1) {
            const count = clampQuantity(quantity);

            // Se estiver editando diretamente um slot já preenchido
            if (pendingEditSlotIdx !== null && pendingEditSlotIdx >= 0) {
                inventorySlotsState[pendingEditSlotIdx] = {
                    name: item.name,
                    img: item.img,
                    count
                };
                renderInventorySlots();
                saveInventoryToCloud();
                return;
            }

            let targetIdx = -1;
            inventorySlots.forEach((s, i) => {
                if (s.classList.contains('selected')) targetIdx = i;
            });

            // Se não houver slot selecionado manualmente, preenche de baixo para cima
            if (targetIdx === -1) {
                const bottomUpOrder = getBottomUpSlotOrder();
                for (const idx of bottomUpOrder) {
                    if (!inventorySlotsState[idx]) {
                        targetIdx = idx;
                        break;
                    }
                }
            }

            if (targetIdx !== -1) {
                inventorySlotsState[targetIdx] = {
                    name: item.name,
                    img: item.img,
                    count
                };
                renderInventorySlots();
                saveInventoryToCloud();
            }
        }

        // Eventos do Quadrado de Escolha de Quantidade
        mcQtyMinusBtn.addEventListener('click', () => {
            mcQtyInput.value = clampQuantity((parseInt(mcQtyInput.value, 10) || 1) - 1);
        });

        mcQtyPlusBtn.addEventListener('click', () => {
            mcQtyInput.value = clampQuantity((parseInt(mcQtyInput.value, 10) || 1) + 1);
        });

        mcQtyPresetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                mcQtyInput.value = clampQuantity(btn.dataset.preset);
            });
        });

        mcQtyInput.addEventListener('change', () => {
            mcQtyInput.value = clampQuantity(mcQtyInput.value);
        });

        mcQtyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                mcQtyConfirmBtn.click();
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeQuantityModal();
            }
        });

        mcQtyCancelBtn.addEventListener('click', closeQuantityModal);

        mcQtyOverlay.addEventListener('click', (e) => {
            if (e.target === mcQtyOverlay) closeQuantityModal();
        });

        mcQtyConfirmBtn.addEventListener('click', () => {
            if (!pendingItemForQty) return;
            const qty = clampQuantity(mcQtyInput.value);
            equipItemToInventory(pendingItemForQty, qty);
            closeQuantityModal();
        });

        inventorySlots.forEach((slot, idx) => {
            slot.addEventListener('click', () => {
                // Se há um item marcado para mover, move/troca para o slot clicado
                if (movingFromSlotIdx !== null) {
                    if (movingFromSlotIdx === idx) {
                        clearMovingState();
                        openQuantityModal(inventorySlotsState[idx], idx);
                        return;
                    }
                    const from = movingFromSlotIdx;
                    clearMovingState();
                    moveOrSwapInventorySlots(from, idx);
                    inventorySlots.forEach(s => s.classList.remove('selected'));
                    slot.classList.add('selected');
                    return;
                }

                inventorySlots.forEach(s => s.classList.remove('selected'));
                slot.classList.add('selected');

                // Ao clicar em um slot com item, seleciona-o para mover para outro slot ou lixeira
                if (inventorySlotsState[idx]) {
                    movingFromSlotIdx = idx;
                    slot.classList.add('moving-source');
                }
            });

            // Duplo clique abre o quadrado de quantidade (1 a 64)
            slot.addEventListener('dblclick', () => {
                if (inventorySlotsState[idx]) {
                    clearMovingState();
                    openQuantityModal(inventorySlotsState[idx], idx);
                }
            });

            // Arrastar e soltar (Drag & Drop) entre slots do inventário
            slot.addEventListener('dragstart', (e) => {
                if (!inventorySlotsState[idx]) {
                    e.preventDefault();
                    return;
                }
                draggedSlotIdx = idx;
                clearMovingState();
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', String(idx));
            });

            slot.addEventListener('dragover', (e) => {
                if (draggedSlotIdx !== null) {
                    e.preventDefault();
                    slot.classList.add('drag-over');
                }
            });

            slot.addEventListener('dragleave', () => {
                slot.classList.remove('drag-over');
            });

            slot.addEventListener('drop', (e) => {
                e.preventDefault();
                slot.classList.remove('drag-over');
                if (draggedSlotIdx !== null && draggedSlotIdx !== idx) {
                    moveOrSwapInventorySlots(draggedSlotIdx, idx);
                    inventorySlots.forEach(s => s.classList.remove('selected'));
                    slot.classList.add('selected');
                }
                draggedSlotIdx = null;
            });

            slot.addEventListener('dragend', () => {
                draggedSlotIdx = null;
                inventorySlots.forEach(s => s.classList.remove('drag-over'));
                mcTrashSlot.classList.remove('drag-over');
            });

            // Clique direito limpa o slot e atualiza no banco de dados
            slot.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                deleteItemAtSlot(idx);
            });
        });

        // Eventos da Lixeira (clique com item selecionado ou arrastar e soltar)
        mcTrashSlot.addEventListener('click', () => {
            if (movingFromSlotIdx !== null) {
                deleteItemAtSlot(movingFromSlotIdx);
                return;
            }
            let selectedIdx = -1;
            inventorySlots.forEach((s, i) => {
                if (s.classList.contains('selected')) selectedIdx = i;
            });
            if (selectedIdx !== -1 && inventorySlotsState[selectedIdx]) {
                deleteItemAtSlot(selectedIdx);
            }
        });

        mcTrashSlot.addEventListener('dragover', (e) => {
            if (draggedSlotIdx !== null) {
                e.preventDefault();
                mcTrashSlot.classList.add('drag-over');
            }
        });

        mcTrashSlot.addEventListener('dragleave', () => {
            mcTrashSlot.classList.remove('drag-over');
        });

        mcTrashSlot.addEventListener('drop', (e) => {
            e.preventDefault();
            mcTrashSlot.classList.remove('drag-over');
            if (draggedSlotIdx !== null) {
                deleteItemAtSlot(draggedSlotIdx);
                draggedSlotIdx = null;
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                clearMovingState();
            }
            if (mcQtyOverlay.classList.contains('active')) {
                return;
            }
            if (document.activeElement === jeiSearchInput) {
                return;
            }
            const num = parseInt(e.key, 10);
            if (num >= 1 && num <= 9 && hotbarSlots[num - 1]) {
                clearMovingState();
                inventorySlots.forEach(s => s.classList.remove('selected'));
                hotbarSlots[num - 1].classList.add('selected');
            }
        });

        // Inicializa a sincronização com o banco de dados na nuvem
        initCloudDatabase();
    </script>

</body>
</html>
